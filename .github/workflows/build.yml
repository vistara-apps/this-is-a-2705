name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install

    - name: Create dummy .env file
      run: |
        cp .env.example .env
        sed -i 's/your-supabase-url/https:\/\/example.supabase.co/g' .env
        sed -i 's/your-supabase-anon-key/eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.example/g' .env
        sed -i 's/your-gemini-api-key/DUMMY_GEMINI_KEY/g' .env
        sed -i 's/your-apyhub-api-key/DUMMY_APYHUB_KEY/g' .env

    - name: Create vite.config.js with optimized chunk settings
      run: |
        cat > vite.config.js << 'EOL'
        import { defineConfig } from 'vite'
        import react from '@vitejs/plugin-react'

        // https://vitejs.dev/config/
        export default defineConfig({
          plugins: [react()],
          build: {
            chunkSizeWarningLimit: 1000, // Increase the warning limit to 1000kb
            rollupOptions: {
              output: {
                manualChunks: {
                  vendor: ['react', 'react-dom', 'react-router-dom'],
                  ui: ['@rainbow-me/rainbowkit'],
                  blockchain: ['wagmi', 'viem'],
                  supabase: ['@supabase/supabase-js']
                }
              }
            }
          }
        })
        EOL

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096
        
    - name: Create build success file
      run: echo "Build completed successfully" > build-success.txt
        
    - name: Comment PR with build success
      if: github.event_name == 'pull_request' && success()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `✅ **Build Successful!**
            
            The application has been successfully built. Vercel deployment is not configured for this repository yet.
            
            To deploy this application:
            1. Set up a Vercel project
            2. Configure the following secrets in the repository:
               - VERCEL_TOKEN
               - VERCEL_ORG_ID
               - VERCEL_PROJECT_ID
            3. Update the workflow file to enable Vercel deployment`
          });
